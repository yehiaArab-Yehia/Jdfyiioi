<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محادثة خاصة</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="setup"><h1>محادثة خاصة 🔒</h1><p>ربط مباشر بين هاتفين عبر WebRTC.</p>
<button id="offerBtn">هاتف 1: إنشاء كود</button><button id="answerBtn">هاتف 2: استقبال</button>
<label>كودك</label><textarea id="local" readonly></textarea><button id="copy">نسخ</button>
<label>كود الطرف الآخر</label><textarea id="remote"></textarea><button id="connect">إتمام الاتصال</button><p id="status">غير متصل</p></section>
<section id="chat" class="hidden"><header><b>محادثة خاصة</b><button id="reset">فصل</button></header><div id="messages"></div><form id="form"><input id="input" placeholder="اكتب رسالة..." autocomplete="off"><button>إرسال</button></form></section>
</main><script src="app.js"></script></body></html>
